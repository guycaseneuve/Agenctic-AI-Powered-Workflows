name: Deploy nopCommerce to Azure Web App

on:
  push:
    branches: [main]
    paths:
      - "nopCommerce/src/**"
      - "nopCommerce/global.json"
      - ".github/workflows/deploy-azure-webapp.yml"
  pull_request:
    branches: [main]
    paths:
      - "nopCommerce/src/**"
      - "nopCommerce/global.json"
      - ".github/workflows/deploy-azure-webapp.yml"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the selected main branch to the protected dev Web App
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nopcommerce-webapp-deploy
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: nopCommerce/global.json

      - name: Restore solution
        run: dotnet restore nopCommerce/src/NopCommerce.sln

      - name: Build solution
        run: dotnet build nopCommerce/src/NopCommerce.sln --no-restore --configuration Release

      - name: Test solution
        run: dotnet test nopCommerce/src/NopCommerce.sln --no-build --no-restore --configuration Release --verbosity normal

      - name: Publish Nop.Web
        run: dotnet publish nopCommerce/src/Presentation/Nop.Web/Nop.Web.csproj --no-restore --configuration Release --output "${{ runner.temp }}\nopcommerce-publish"

      - name: Archive published files at package root
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}\nopcommerce-publish\*" -DestinationPath "${{ runner.temp }}\nopcommerce-webapp.zip" -CompressionLevel Optimal

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: nopcommerce-webapp
          path: "${{ runner.temp }}\nopcommerce-webapp.zip"
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build-test-publish
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_deploy))
    runs-on: windows-latest
    environment: nopcommerce-dev
    permissions:
      contents: read
    steps:
      - name: Download published Web App
        uses: actions/download-artifact@v4
        with:
          name: nopcommerce-webapp
          path: nopcommerce-artifact

      - name: Locate and validate deployment package
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "nopcommerce-webapp.zip" -File -Recurse)
          if ($packages.Count -ne 1) {
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Force | Select-Object Name, FullName
            throw "Expected one nopcommerce-webapp.zip after artifact download; found $($packages.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            if ($null -eq $archive.GetEntry("web.config")) {
              throw "Deployment ZIP does not contain web.config at its root."
            }
          }
          finally {
            $archive.Dispose()
          }

          "package-path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify deployment settings
        shell: pwsh
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_NAME)) {
            throw "Set AZURE_WEBAPP_NAME in the nopcommerce-dev environment to the app_name used by the infrastructure workflow."
          }
          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_PROFILE)) {
            throw "Configure AZURE_WEBAPP_PUBLISH_PROFILE as a secret in the nopcommerce-dev GitHub environment."
          }

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ steps.package.outputs.package-path }}

      - name: Verify Web App responds
        shell: pwsh
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBAPP_URL)) {
            throw "Azure deployment did not return a Web App URL."
          }

          $response = Invoke-WebRequest -Uri $env:WEBAPP_URL -MaximumRedirection 5 -TimeoutSec 30 -SkipHttpErrorCheck
          if ($response.StatusCode -ge 400) {
            throw "Web App returned HTTP $($response.StatusCode) after deployment."
          }